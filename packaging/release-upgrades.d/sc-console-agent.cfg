# Read by Ubuntu's release upgrade (do-release-upgrade), which switches off
# every APT source whose address is not Ubuntu's own or listed here. With the
# agent's repository listed, the agent keeps receiving updates after the
# upgrade. Delete this file to have the agent's source treated like any other
# third-party source.
#
# The upgrade compares whole addresses, so these are exactly what install.sh
# writes for the stable and the beta channel.
[ThirdPartyMirrors]
sc-console-agent = https://repo.cloud.strettch.com/console/aptly
sc-console-agent-beta = https://repo.cloud.strettch.com/console/beta/aptly
