name: Beta Release

on:
  push:
    branches: [ dev ]

jobs:
  beta-release:
    name: Build and Deploy Beta Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      actions: read    # Required for downloading artifacts
      checks: read     # Required for status checks
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for changelog generation

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Generate beta version
      id: version
      run: |
        chmod +x .github/scripts/generate-version.sh
        VERSION=$(.github/scripts/generate-version.sh beta)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated beta version: $VERSION"

    - name: Generate changelog
      id: changelog
      run: |
        chmod +x .github/scripts/generate-changelog.sh
        CHANGELOG=$(.github/scripts/generate-changelog.sh beta)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Build binary
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        make GOOS=linux GOARCH=amd64 build VERSION=$VERSION

    - name: Install packaging dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev build-essential
        sudo gem install fpm

    - name: Build package
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Create staging directory
        STAGING_DIR="/tmp/sc-console-agent-build"
        mkdir -p "${STAGING_DIR}/usr/local/bin" "${STAGING_DIR}/etc/systemd/system"
        
        # Copy files
        cp build/sc-console-agent "${STAGING_DIR}/usr/local/bin/"
        chmod +x "${STAGING_DIR}/usr/local/bin/sc-console-agent"
        cp packaging/scripts/sc-console-agent-updater.sh "${STAGING_DIR}/usr/local/bin/"
        chmod +x "${STAGING_DIR}/usr/local/bin/sc-console-agent-updater.sh"
        cp packaging/systemd/sc-console-agent.service "${STAGING_DIR}/etc/systemd/system/"
        cp packaging/systemd/sc-console-agent-update-scheduler.service "${STAGING_DIR}/etc/systemd/system/"
        cp packaging/systemd/sc-console-agent-update-scheduler.timer "${STAGING_DIR}/etc/systemd/system/"
        
        # Build package
        fpm -s dir -t deb -n sc-console-agent -v ${VERSION#v} \
          -C "${STAGING_DIR}/" \
          --description "Strettch Cloud Agent - Enabling secure console access and instance management. (Beta Release)" \
          --maintainer "engineering@strettch.com" \
          --url "https://github.com/strettch/sc-console-agent" \
          --depends "libc6" --depends "dmidecode" \
          --after-install "packaging/scripts/post-install.sh" \
          --before-remove "packaging/scripts/pre-remove.sh"

    - name: Deploy to repository
      env:
        REPO_SSH_KEY: ${{ secrets.REPO_SSH_KEY }}
        REPO_HOST: ${{ secrets.REPO_HOST }}
        REPO_USER: ${{ secrets.REPO_USER }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$REPO_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$REPO_HOST" >> ~/.ssh/known_hosts
        
        # Update codebase and deploy packages
        scp -i ~/.ssh/deploy_key *.deb "${REPO_USER}@${REPO_HOST}:/root/sc-console-agent/"
        ssh -i ~/.ssh/deploy_key "${REPO_USER}@${REPO_HOST}" "cd /root/sc-console-agent && git checkout . && git clean -fd && git checkout dev && git fetch origin dev && git reset --hard origin/dev && ./setup_repo.sh"
        
        echo "✅ Beta deployment completed successfully!"
        echo "📦 Repository updated at: https://repo.cloud.strettch.dev/console/"

    - name: Create GitHub pre-release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.version }}
        name: "Beta Release ${{ steps.version.outputs.version }}"
        body: |
          ## Beta Release ${{ steps.version.outputs.version }}
          
          This is an automated beta release containing the latest changes from the main branch.
          
          ### Installation
          ```bash
          curl -sSL https://repo.cloud.strettch.dev/console/install.sh | sudo bash
          ```
          
          ### Changes in this beta release:
          ${{ steps.changelog.outputs.changelog }}
          
          **Note:** This is a beta release. Use stable releases for production deployments.
        prerelease: true
        artifacts: "sc-agent_*.deb"
        token: ${{ secrets.GITHUB_TOKEN }}